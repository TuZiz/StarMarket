reject-session: '<#FF5555>✖ <#FF7777>界面状态已过期，请重新打开交易所进行操作。'
reject-arguments: '<#FF5555>✖ <#FF7777>指令参数不完整，请输入 <#FFFFFF>/market help <#FF7777>查看正确用法。'
reject-listing-tax: '<#FF5555>✖ <#FF7777>上架税扣款失败，未建立订单；物品将自动返还 <#8899AA>(背包满则掉落在脚下)'
