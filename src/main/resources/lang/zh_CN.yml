listing-empty-hand: '<#FF5555>✖ <#FF7777>主手没有任何物品，请先手持需要上架的物品。'
listing-price-range: '<#FF5555>✖ <#FF7777>单个售价超出范围，须在 <#FFCC66>{floor} ~ {ceiling} 金币 <#FF7777>之间。'
