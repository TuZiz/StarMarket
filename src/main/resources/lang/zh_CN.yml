schema-version: 3

# ─── 基础状态提示 ──────────────────────────────────────────────
error: '<#FF5555>✖ <#FF7777>操作未完成，请检查输入内容。'
busy: '<#FFAA00>⏳ <#FFCC66>交易处理中，请稍候...'
permission: '<#FF5555>✖ <#FF7777>权限不足，你无法使用此功能。'
admin-failed: '<#FF5555>✖ <#FF7777>管理操作未完成 <#8899AA>(详细原因已记入控制台)'
