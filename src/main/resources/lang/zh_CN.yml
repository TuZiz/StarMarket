tier-overflow: '<#FFAA00>✦ <#FFCC66>当前共有 <#FFFFFF>{count} <#FFCC66>个价格档位，请使用上下页翻阅全部。'
row: '<#88CCFF>{value}'
category-other: '<#AABBDD>📦 其他物品'

search-input: '<#55AAFF>✎ <#88CCFF>请在聊天栏输入 <#FFFFFF>物品关键词 <#8899AA>| 输入 <#FF7777>cancel <#8899AA>返回'
