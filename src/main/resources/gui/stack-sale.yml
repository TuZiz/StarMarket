schema-version: 1
title: '<#55AAFF>✦ <#88CCFF>确认出售 <#667788>· <#AABBDD>{name}'

shape:
  - '####I####'
  - '#   P   #'
  - '# Y S R #'
  - '#########'

elements:
  '#':
    material: 'BLACK_STAINED_GLASS_PANE'
    name: ''

  'I':
    material: 'PAPER'
    name: '<#88CCFF>✦ {name}'

  'P':
    material: 'NAME_TAG'
    name: '<#88CCFF>❖ 设置单个售价'
    lore:
      - ''
      - '<#AABBDD>调整该物品上架至玩家市场的单价'
      - ''
      - '<#FFCC66>▸ 点击输入价格'

  'Y':
    material: 'LIME_CONCRETE'
    name: '<#77DD99>✦ 确认上架给玩家'
    lore:
      - '<#445566>⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯'
      - '<#667788>├ <#AABBDD>上架明细: <#77DD99>整叠 {quantity} 个 <#667788>· <#AABBDD>单价 <#FFCC66>{price}'
      - '<#667788>├ <#AABBDD>定价区间: <#FFCC66>{floor} 至 {ceiling} <#667788>(保底 {recycle})'
      - '<#667788>├ <#AABBDD>成交总额: <#FFCC66>{gross} <#667788>· <#AABBDD>立扣税费 <#FF7777>{fee}'
      - '<#667788>└ <#AABBDD>预计收益: <#77DD99>总额 {gross} <#667788>· <#AABBDD>税后净得 <#77DD99>{net}'
      - ''
      - '<#FFCC66>❖ 上架时立即扣税，撤单或到期均不退税'
      - '<#FFCC66>❖ 有效期 {hours} 小时，未成交不获收益'
      - ''
      - '<#77DD99>▸ 点击上架至市场'

  'S':
    material: 'GOLD_INGOT'
    name: '<#FFCC66>✦ 确认出售给系统'
    lore:
      - '<#445566>⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯'
      - '<#667788>├ <#AABBDD>回收明细: <#77DD99>整叠 {quantity} 个 <#667788>· <#AABBDD>固定单价 <#FFCC66>{recycle}'
      - '<#667788>└ <#AABBDD>实际获得: <#77DD99>{recycle-total} 金币 <#667788>(免税)'
      - ''
      - '<#FFCC66>❖ 系统回收不扣税；特殊数据物品不可回收'
      - ''
      - '<#FFCC66>▸ 点击立即回收'

  'R':
    material: 'REDSTONE'
    name: '<#FF7777>❖ 重新选择'
    lore:
      - ''
      - '<#AABBDD>放弃当前操作并重新选择背包物品'
      - ''
      - '<#FFCC66>▸ 点击返回重选'

row:
  name: '<#88CCFF>✦ {name}'